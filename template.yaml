AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Ghost v2 - AI Social Twin

Parameters:
  Env:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 256
    Layers:
      - !Ref GhostCommonLayer
    Environment:
      Variables:
        ENV: !Ref Env
        LOG_LEVEL: INFO
    Tags:
      Project: ghost
      Env: !Ref Env

Resources:

  # ── API Gateway ────────────────────────────────────────────────────────────

  GhostApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub ghost-api-${Env}
      StageName: !Ref Env
      TracingEnabled: true

  # ── Layer ──────────────────────────────────────────────────────────────────

  GhostCommonLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub ghost-common-${Env}
      ContentUri: layers/ghost_common/
      CompatibleRuntimes: [python3.12]
      RetentionPolicy: Delete
    Metadata:
      BuildMethod: makefile

Outputs:
  StackName:
    Value: !Ref AWS::StackName
