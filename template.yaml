AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Ghost v2 - AI Social Twin

Parameters:
  Env:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 256
    Layers:
      - !Ref GhostCommonLayer
    Environment:
      Variables:
        ENV: !Ref Env
        LOG_LEVEL: INFO
    Tags:
      Project: ghost
      Env: !Ref Env

Resources:

  # ── API Gateway ────────────────────────────────────────────────────────────

  GhostApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub ghost-api-${Env}
      StageName: !Ref Env
      TracingEnabled: true

  # ── SQS Queues ─────────────────────────────────────────────────────────────

  InboundMessageQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ghost-inbound-message-queue-${Env}
      VisibilityTimeout: 120
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt InboundMessageDLQ.Arn
        maxReceiveCount: 3

  InboundMessageDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ghost-inbound-message-dlq-${Env}
      MessageRetentionPeriod: 1209600

  PerceptionOutputQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ghost-perception-output-queue-${Env}
      VisibilityTimeout: 180

  OutboundMessageQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ghost-outbound-message-queue-${Env}.fifo
      FifoQueue: true
      ContentBasedDeduplication: false
      VisibilityTimeout: 60

  HeartbeatQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ghost-heartbeat-queue-${Env}
      VisibilityTimeout: 300

  MemoryProcessingQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ghost-memory-processing-queue-${Env}
      VisibilityTimeout: 300

  PulseQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ghost-pulse-queue-${Env}
      VisibilityTimeout: 60

  EscalationQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ghost-escalation-queue-${Env}
      VisibilityTimeout: 60

  # ── SNS ───────────────────────────────────────────────────────────────────

  EscalationsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub ghost-escalations-${Env}
      Subscription:
        - Protocol: sqs
          Endpoint: !GetAtt EscalationQueue.Arn

  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub ghost-alerts-${Env}

  EscalationQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref EscalationQueue]
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt EscalationQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Ref EscalationsTopic

  # ── DynamoDB (long delays) ─────────────────────────────────────────────────

  LongDelaysTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ghost-long-delays-${Env}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: delay_id
          AttributeType: S
      KeySchema:
        - AttributeName: delay_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES

  # ── Layer ──────────────────────────────────────────────────────────────────

  GhostCommonLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub ghost-common-${Env}
      ContentUri: layers/ghost_common/
      CompatibleRuntimes: [python3.12]
      RetentionPolicy: Delete
    Metadata:
      BuildMethod: makefile

  # ── Lambda Functions ───────────────────────────────────────────────────────

  GhostWebhookReceiver:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ghost-webhook-receiver-${Env}
      CodeUri: functions/webhook_receiver/
      Handler: handler.lambda_handler
      Timeout: 10
      Events:
        WebhookPost:
          Type: Api
          Properties:
            RestApiId: !Ref GhostApi
            Path: /webhook
            Method: POST
        WebhookGet:
          Type: Api
          Properties:
            RestApiId: !Ref GhostApi
            Path: /webhook
            Method: GET
      Policies:
        - SQSSendMessagePolicy:
            QueueName: !GetAtt InboundMessageQueue.QueueName
        - SSMParameterReadPolicy:
            ParameterName: !Sub ghost/${Env}/*

  GhostAgentPerception:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ghost-agent-perception-${Env}
      CodeUri: functions/agent_perception/
      Handler: handler.lambda_handler
      Timeout: 60
      Events:
        InboundQueue:
          Type: SQS
          Properties:
            Queue: !GetAtt InboundMessageQueue.Arn
            BatchSize: 1
      Policies:
        - SQSSendMessagePolicy:
            QueueName: !GetAtt PerceptionOutputQueue.QueueName
        - SSMParameterReadPolicy:
            ParameterName: !Sub ghost/${Env}/*
        - Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource: "arn:aws:bedrock:eu-west-1::foundation-model/anthropic.claude-haiku-4-5*"

  GhostAgentGhost:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ghost-agent-ghost-${Env}
      CodeUri: functions/agent_ghost/
      Handler: handler.lambda_handler
      Timeout: 300
      Events:
        PerceptionOutputQueue:
          Type: SQS
          Properties:
            Queue: !GetAtt PerceptionOutputQueue.Arn
            BatchSize: 1
        HeartbeatQueue:
          Type: SQS
          Properties:
            Queue: !GetAtt HeartbeatQueue.Arn
            BatchSize: 1
      Policies:
        - SQSSendMessagePolicy:
            QueueName: !GetAtt OutboundMessageQueue.QueueName
        - SQSSendMessagePolicy:
            QueueName: !GetAtt EscalationQueue.QueueName
        - SSMParameterReadPolicy:
            ParameterName: !Sub ghost/${Env}/*
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
              Resource:
                - "arn:aws:bedrock:eu-west-1::foundation-model/anthropic.claude-sonnet-4*"
                - "arn:aws:bedrock:eu-west-1::foundation-model/voyage-3*"

  GhostAgentMemory:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ghost-agent-memory-${Env}
      CodeUri: functions/agent_memory/
      Handler: handler.lambda_handler
      Timeout: 300
      Events:
        MemoryProcessingQueue:
          Type: SQS
          Properties:
            Queue: !GetAtt MemoryProcessingQueue.Arn
            BatchSize: 1
      Policies:
        - SSMParameterReadPolicy:
            ParameterName: !Sub ghost/${Env}/*
        - Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - "arn:aws:bedrock:eu-west-1::foundation-model/anthropic.claude-haiku-4-5*"
                - "arn:aws:bedrock:eu-west-1::foundation-model/voyage-3*"

  GhostPulse:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ghost-pulse-${Env}
      CodeUri: functions/pulse/
      Handler: handler.lambda_handler
      Timeout: 60
      Events:
        PulseQueue:
          Type: SQS
          Properties:
            Queue: !GetAtt PulseQueue.Arn
            BatchSize: 1
      Policies:
        - SQSSendMessagePolicy:
            QueueName: !GetAtt PulseQueue.QueueName
        - SQSSendMessagePolicy:
            QueueName: !GetAtt HeartbeatQueue.QueueName
        - SSMParameterReadPolicy:
            ParameterName: !Sub ghost/${Env}/*

  GhostWhatsappSender:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ghost-whatsapp-sender-${Env}
      CodeUri: functions/whatsapp_sender/
      Handler: handler.lambda_handler
      Timeout: 30
      Events:
        OutboundQueue:
          Type: SQS
          Properties:
            Queue: !GetAtt OutboundMessageQueue.Arn
            BatchSize: 1
      Policies:
        - SSMParameterReadPolicy:
            ParameterName: !Sub ghost/${Env}/*

  GhostTelegramBot:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ghost-telegram-bot-${Env}
      CodeUri: functions/telegram_bot/
      Handler: handler.lambda_handler
      Timeout: 10
      Events:
        TelegramWebhook:
          Type: Api
          Properties:
            RestApiId: !Ref GhostApi
            Path: /telegram
            Method: POST
      Policies:
        - SSMParameterReadPolicy:
            ParameterName: !Sub ghost/${Env}/*
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt AlertsTopic.TopicName

  GhostContextAssembler:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ghost-context-assembler-${Env}
      CodeUri: functions/context_assembler/
      Handler: handler.lambda_handler
      Timeout: 30
      Policies:
        - SSMParameterReadPolicy:
            ParameterName: !Sub ghost/${Env}/*

  GhostLongDelayTrigger:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ghost-long-delay-trigger-${Env}
      CodeUri: functions/long_delay_trigger/
      Handler: handler.lambda_handler
      Timeout: 30
      Events:
        DynamoDBStream:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt LongDelaysTable.StreamArn
            StartingPosition: TRIM_HORIZON
            FilterCriteria:
              Filters:
                - Pattern: '{"eventName": ["REMOVE"]}'
      Policies:
        - SQSSendMessagePolicy:
            QueueName: !GetAtt PulseQueue.QueueName

  GhostWorldIngestion:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ghost-world-ingestion-${Env}
      CodeUri: functions/world_ingestion/
      Handler: handler.lambda_handler
      Timeout: 300
      Policies:
        - SSMParameterReadPolicy:
            ParameterName: !Sub ghost/${Env}/*
        - Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource: "arn:aws:bedrock:eu-west-1::foundation-model/anthropic.claude-haiku-4-5*"

Outputs:
  StackName:
    Value: !Ref AWS::StackName
  WebhookUrl:
    Value: !Sub https://${GhostApi}.execute-api.${AWS::Region}.amazonaws.com/${Env}/webhook
  TelegramWebhookUrl:
    Value: !Sub https://${GhostApi}.execute-api.${AWS::Region}.amazonaws.com/${Env}/telegram
  OutboundQueueUrl:
    Value: !Ref OutboundMessageQueue
  PulseQueueUrl:
    Value: !Ref PulseQueue
  LongDelaysTableName:
    Value: !Ref LongDelaysTable
